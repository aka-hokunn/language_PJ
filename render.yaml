services:
  - type: web
    name: funwords-english
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix server
    startCommand: node server/server.js
    healthCheckPath: /api/test-db
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
